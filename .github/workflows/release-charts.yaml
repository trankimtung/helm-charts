name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package and push charts
        run: |
          mkdir -p /tmp/helm-packages
          # Package and push one chart at a time, the common library first,
          # so charts depending on a common version released in the same
          # push can resolve it from the registry.
          for chart in charts/common/ $(ls -d charts/*/ | grep -v '^charts/common/$'); do
            name=$(basename "$chart")
            version=$(grep '^version:' "$chart/Chart.yaml" | awk '{print $2}')
            if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/helm-charts/$name" --version "$version" > /dev/null 2>&1; then
              echo "$name:$version already published."
              continue
            fi
            helm dependency update "$chart"
            helm package "$chart" --destination /tmp/helm-packages
            helm push "/tmp/helm-packages/$name-$version.tgz" oci://ghcr.io/${{ github.repository_owner }}/helm-charts
          done
