nameOverride: ""
fullnameOverride: ""

global:
  uid: 977
  gid: 977

components:
  searxng:
    # SearXNG settings. ref: https://docs.searxng.org/admin/settings/
    # server.secret_key comes from the SEARXNG_SECRET env var.
    cm:
      config:
        mountTo:
          searxng: /config
        data:
          settings.yml: |
            use_default_settings: true
            server:
              limiter: false
              image_proxy: false
            search:
              formats:
                - html
                - json

    deployments:
      searxng:
        replicas: 1
        strategy:
          type: Recreate

        initContainers: []

        extraEnv: {}
        envFrom: []

        extraVolumes:
          - name: etc-searxng
            emptyDir: {}
        extraVolumeMounts:
          - name: etc-searxng
            mountPath: /etc/searxng

        containers:
          searxng:
            image:
              repository: searxng/searxng
              tag: 2026.10.24-ef0ec03da@sha256:2fe9f5f6f9a712321e3d1de4ceb4d34e945c82748f63f6ccb9f46f75cb5f7787
              pullPolicy: IfNotPresent

            ports:
              http:
                containerPort: 8080
                protocol: TCP

            uid: ""  # Defaults to global.uid.
            gid: ""  # Defaults to global.gid.

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

            env:
              SEARXNG_SETTINGS_PATH: /config/settings.yml

            extraEnv: {}
            envFrom: []

            probes:
              startup:
                httpGet:
                  path: /healthz
                  port: http
                failureThreshold: 30
                periodSeconds: 2

              liveness:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10

              readiness:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10

            extraVolumeMounts: []

            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi

    persistence:
      cache:
        enabled: false
        existingClaim: ""  # Use a pre-existing PVC. Skips PVC creation; enabled is ignored.
        mountTo:
          searxng: /var/cache/searxng
        size: 1Gi
        accessMode: ReadWriteOnce
        storageClass: ""

    services:
      searxng:
        type: ClusterIP
        ports:
          - name: http
            port: 8080

    ingresses:
      searxng:
        enabled: false
        className: ""
        portName: http
        hosts:
          - searxng.example.com
        paths:
          - path: /
            pathType: Prefix
        tls:
          enabled: false
          secretName: ""  # Defaults to <fullname>-tls.
