nameOverride: ""
fullnameOverride: ""

global:
  # The image ships all files owned by its "searxng" user (977). Running as
  # that user means the entrypoint skips its chown pass and starts granian.
  uid: 977
  gid: 977

components:
  searxng:
    # SearXNG settings. ref: https://docs.searxng.org/admin/settings/
    # The container reads this file via SEARXNG_SETTINGS_PATH (see env below).
    # server.secret_key is intentionally absent: provide it as the env var
    # SEARXNG_SECRET (e.g. via envFrom a Secret).
    # SearXNG reads settings once at start and the pod template carries no
    # config checksum, so after changing this run: kubectl rollout restart deployment/searxng
    cm:
      config:
        mountTo:
          searxng: /config
        data:
          settings.yml: |
            use_default_settings: true
            server:
              limiter: false
              image_proxy: false
            search:
              formats:
                - html
                - json

    deployments:
      searxng:
        replicas: 1
        strategy:
          type: RollingUpdate

        initContainers: []

        extraEnv: {}
        envFrom: []

        # The entrypoint requires both directories to exist and be writable:
        # it drops a template settings.yml into /etc/searxng on start (unused,
        # because SEARXNG_SETTINGS_PATH points at /config) and caches favicons
        # under /var/cache/searxng.
        extraVolumes:
          - name: etc-searxng
            emptyDir: {}
          - name: cache
            emptyDir: {}
        extraVolumeMounts:
          - name: etc-searxng
            mountPath: /etc/searxng
          - name: cache
            mountPath: /var/cache/searxng

        containers:
          searxng:
            image:
              repository: searxng/searxng
              tag: 2026.9.5-c7f3080aa@sha256:1192ec9fd4d412d5454131935ad55237136e7d46c47a24ecf4b1ba5613ea8d18
              pullPolicy: IfNotPresent

            ports:
              http:
                containerPort: 8080
                protocol: TCP

            uid: ""  # Defaults to global.uid.
            gid: ""  # Defaults to global.gid.

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

            env:
              SEARXNG_SETTINGS_PATH: /config/settings.yml

            extraEnv: {}
            envFrom: []

            probes:
              startup:
                httpGet:
                  path: /healthz
                  port: http
                failureThreshold: 30
                periodSeconds: 2

              liveness:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10

              readiness:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10

            extraVolumeMounts: []

            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi

    services:
      searxng:
        type: ClusterIP
        ports:
          - name: http
            port: 8080

    ingresses:
      searxng:
        enabled: false
        className: ""
        portName: http
        hosts:
          - searxng.example.com
        paths:
          - path: /
            pathType: Prefix
        tls:
          enabled: false
          secretName: ""  # Defaults to <fullname>-tls.
