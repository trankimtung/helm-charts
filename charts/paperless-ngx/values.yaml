nameOverride: ""
fullnameOverride: ""

global:
  uid: 1000
  gid: 1000

components:
  paperless-ngx:
    enabled: true
    deployments:
      paperless-ngx:
        replicas: 1
        strategy:
          type: Recreate

        initContainers: []

        # Extra env vars injected into all containers. ref: https://docs.paperless-ngx.com/configuration/
        extraEnv: {}
        envFrom: []

        extraVolumes: []
        extraVolumeMounts: []

        containers:
          paperless-ngx:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.0.5@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b
              pullPolicy: IfNotPresent

            ports:
              paperless:
                containerPort: 8000
                protocol: TCP

            uid: ""  # Defaults to global.uid.
            gid: ""  # Defaults to global.gid.

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

            # Defaults to SQLite on the data volume. For PostgreSQL set
            # PAPERLESS_DBENGINE=postgresql (required since 3.0) plus
            # PAPERLESS_DBHOST/DBNAME/DBUSER/DBPASS (or *_FILE) via extraEnv/envFrom.
            # PAPERLESS_SECRET_KEY (or *_FILE) is required since 3.0.
            env:
              PAPERLESS_PORT: "8000"
              PAPERLESS_REDIS: redis://paperless-ngx-redis:6379

            extraEnv: {}
            envFrom: []

            probes:
              startup:
                httpGet:
                  path: /
                  port: paperless
                failureThreshold: 60
                periodSeconds: 5

              liveness:
                httpGet:
                  path: /
                  port: paperless
                periodSeconds: 10

              readiness:
                httpGet:
                  path: /
                  port: paperless
                periodSeconds: 10

            extraVolumeMounts: []

            resources:
              limits:
                cpu: "2"
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 512Mi

    services:
      paperless-ngx:
        type: ClusterIP
        ports:
          - name: paperless
            port: 8000

    ingresses:
      paperless-ngx:
        enabled: false
        className: ""
        portName: paperless
        hosts:
          - paperless.example.com
        paths:
          - path: /
            pathType: Prefix
        tls:
          enabled: false
          secretName: ""  # Defaults to <fullname>-tls.

    persistence:
      data:
        # Disable to use emptyDir (data lost on pod deletion).
        enabled: true
        existingClaim: ""
        mountTo:
          paperless-ngx: /usr/src/paperless/data
        size: 2Gi
        accessMode: ReadWriteOnce
        storageClass: ""  # Leave empty for the cluster default StorageClass.
      media:
        # Disable to use emptyDir (data lost on pod deletion).
        enabled: true
        existingClaim: ""
        mountTo:
          paperless-ngx: /usr/src/paperless/media
        size: 5Gi
        accessMode: ReadWriteOnce
        storageClass: ""  # Leave empty for the cluster default StorageClass.
      export:
        enabled: false
        existingClaim: ""
        mountTo:
          paperless-ngx: /usr/src/paperless/export
        size: 1Gi
        accessMode: ReadWriteOnce
        storageClass: ""
      consume:
        enabled: false
        existingClaim: ""
        mountTo:
          paperless-ngx: /usr/src/paperless/consume
        size: 1Gi
        accessMode: ReadWriteOnce
        storageClass: ""

  redis:
    enabled: true
    deployments:
      redis:
        replicas: 1
        strategy:
          type: Recreate

        initContainers: []

        extraEnv: {}
        envFrom: []

        extraVolumes: []
        extraVolumeMounts: []

        containers:
          redis:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.1-trixie@sha256:64e361b630ecf18dff7ca4df6a88e6eafc193687eb48cff2c7e0a293ab67d29a
              pullPolicy: IfNotPresent

            ports:
              redis:
                containerPort: 6379
                protocol: TCP

            uid: ""
            gid: ""

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

            env: {}
            extraEnv: {}
            envFrom: []

            probes:
              liveness:
                tcpSocket:
                  port: redis
                periodSeconds: 10
              readiness:
                tcpSocket:
                  port: redis
                periodSeconds: 10

            extraVolumeMounts: []

            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi

    services:
      redis:
        type: ClusterIP
        ports:
          - name: redis
            port: 6379

  # Optional: Tika + Gotenberg enable consumption of office documents and
  # e-mails (.doc, .xlsx, .odt, .eml). When enabling, also set on the
  # paperless-ngx container:
  #   PAPERLESS_TIKA_ENABLED: "true"
  #   PAPERLESS_TIKA_ENDPOINT: http://paperless-ngx-tika:9998
  #   PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-ngx-gotenberg:3000
  tika:
    enabled: false
    deployments:
      tika:
        replicas: 1
        strategy:
          type: Recreate

        initContainers: []

        extraEnv: {}
        envFrom: []

        extraVolumes: []
        extraVolumeMounts: []

        containers:
          tika:
            image:
              repository: docker.io/apache/tika
              tag: 3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
              pullPolicy: IfNotPresent

            ports:
              tika:
                containerPort: 9998
                protocol: TCP

            uid: ""
            gid: ""

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

            env: {}
            extraEnv: {}
            envFrom: []

            probes:
              startup:
                httpGet:
                  path: /tika
                  port: tika
                failureThreshold: 30
                periodSeconds: 5
              liveness:
                httpGet:
                  path: /tika
                  port: tika
                periodSeconds: 10
              readiness:
                httpGet:
                  path: /tika
                  port: tika
                periodSeconds: 10

            extraVolumeMounts: []

            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi

    services:
      tika:
        type: ClusterIP
        ports:
          - name: tika
            port: 9998

  gotenberg:
    enabled: false
    deployments:
      gotenberg:
        replicas: 1
        strategy:
          type: Recreate

        initContainers: []

        extraEnv: {}
        envFrom: []

        extraVolumes: []
        extraVolumeMounts: []

        containers:
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 8.34.0@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
              pullPolicy: IfNotPresent

            # The chromium route is only used to convert .eml files; block
            # external content like tracking pixels or javascript.
            args:
              - gotenberg
              - --chromium-disable-javascript=true
              - --chromium-allow-list=file:///tmp/.*

            ports:
              gotenberg:
                containerPort: 3000
                protocol: TCP

            # The gotenberg image only provisions uid/gid 1001; chromium needs
            # the matching home directory to be resolvable.
            uid: 1001
            gid: 1001

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

            env: {}
            extraEnv: {}
            envFrom: []

            probes:
              startup:
                httpGet:
                  path: /health
                  port: gotenberg
                failureThreshold: 30
                periodSeconds: 5
              liveness:
                httpGet:
                  path: /health
                  port: gotenberg
                periodSeconds: 10
              readiness:
                httpGet:
                  path: /health
                  port: gotenberg
                periodSeconds: 10

            extraVolumeMounts: []

            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi

    services:
      gotenberg:
        type: ClusterIP
        ports:
          - name: gotenberg
            port: 3000
