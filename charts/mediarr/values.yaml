nameOverride: ""
fullnameOverride: ""

global:
  uid: 1000
  gid: 1000
  # Injected into every container (TZ for all *arr apps).
  env:
    TZ: UTC
  extraVolumes: []
  extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

components:
  prowlarr:
    enabled: true
    deployments:
      prowlarr:
        replicas: 1
        strategy:
          type: Recreate
        initContainers: []
        extraEnv: {}
        envFrom: []
        extraVolumes:
          - name: run
            emptyDir: {}
        extraVolumeMounts: []
        containers:
          prowlarr:
            image:
              repository: ghcr.io/linuxserver/prowlarr
              tag: 3.1.0@sha256:2806c9b763810589c42157730d547c293639e55c7610e9f5069314854639ec48
              pullPolicy: IfNotPresent
            ports:
              prowlarr:
                containerPort: 9696
                protocol: TCP
            uid: ""
            gid: ""
            securityContext:
              allowPrivilegeEscalation: true
              capabilities:
                drop: [ALL]
                add: [CHOWN, SETGID, SETUID]
              seccompProfile:
                type: RuntimeDefault
            env:
              PUID: "1000"
              PGID: "1000"
              PROWLARR__SERVER__PORT: "9696"
            extraEnv: {}
            envFrom: []
            probes:
              liveness:
                httpGet: {path: /, port: prowlarr}
                initialDelaySeconds: 30
                periodSeconds: 10
              readiness:
                httpGet: {path: /, port: prowlarr}
                initialDelaySeconds: 15
                periodSeconds: 5
            extraVolumeMounts:
              - name: run
                mountPath: /run
            resources:
              limits: {cpu: 500m, memory: 512Mi}
              requests: {cpu: 50m, memory: 128Mi}
    services:
      prowlarr:
        type: ClusterIP
        ports:
          - name: prowlarr
            port: 9696
    ingresses:
      prowlarr:
        enabled: false
        className: ""
        portName: prowlarr
        annotations: {}
        hosts:
          - prowlarr.example.com
        paths:
          - path: /
            pathType: Prefix
        tls:
          enabled: false
          secretName: ""
    persistence:
      config:
        enabled: true
        existingClaim: ""
        mountTo:
          prowlarr: /config
        size: 1Gi
        accessMode: ReadWriteOnce
        storageClass: ""

