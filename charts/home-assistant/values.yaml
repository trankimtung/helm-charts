global:
  timezone: UTC

homeAssistant:
  image:
    repository: ghcr.io/home-assistant/home-assistant
    tag: "2026.10.3@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f"
    pullPolicy: IfNotPresent

  initContainer:
    image:
      repository: busybox
      tag: "1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"
      pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    extraLabels: {}

  callbackService:
    enabled: false
    type: LoadBalancer
    extraLabels: {}
    annotations: {}
    sonosPort: 1400

  ingress:
    enabled: false
    className: ""
    extraLabels: {}
    annotations: {}
    hosts:
      - home-assistant.example.com
    path: /
    pathType: Prefix
    servicePort: http

  resources:
    limits:
      cpu: 1
      memory: 2048Mi
    requests:
      cpu: 200m
      memory: 1024Mi

  persistence:
    config:
      size: 5Gi
      accessMode: ReadWriteOnce
      # storageClass: ""

  # Default configuration mounted at /config/configuration.yaml
  defaultConfig: |
    # Loads default set of integrations. Do not remove.
    default_config:

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # HTTP integration configuration for reverse proxy support
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 192.168.0.0/16

# Zigbee2MQTT bridge
zigbee2mqtt:
  enabled: false
  image:
    repository: koenkk/zigbee2mqtt
    tag: "2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311"
    pullPolicy: IfNotPresent
  port: 8080
  # Host path to the Zigbee adapter device (e.g. /dev/ttyACM0, /dev/ttyUSB0)
  # Leave empty if using a network adapter (e.g. ser2net)
  adapter:
    hostPath: ""
  defaultConfig: |
    homeassistant: true
    permit_join: false
    mqtt:
      server: mqtt://localhost:1883
    serial:
      adapter: ember
      port: tcp://10.0.2.10:6638
      baudrate: 115200
      rtscts: false
    frontend:
      port: 8080
    advanced:
      log_output:
        - console
  ingress:
    enabled: false
    className: ""
    extraLabels: {}
    annotations: {}
    hosts:
      - zigbee2mqtt.example.com
    path: /
    pathType: Prefix
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  persistence:
    enabled: false
    size: 1Gi
    accessMode: ReadWriteOnce
    # storageClass: ""

# Mosquitto MQTT broker
mqtt:
  enabled: false
  image:
    repository: eclipse-mosquitto
    tag: "2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f"
    pullPolicy: IfNotPresent
  port: 1883
  defaultConfig: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  persistence:
    enabled: false
    size: 1Gi
    accessMode: ReadWriteOnce
    # storageClass: ""
