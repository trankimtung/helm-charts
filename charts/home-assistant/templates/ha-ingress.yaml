{{- if .Values.homeAssistant.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "home-assistant.fullname" . }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
    {{- with .Values.homeAssistant.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.homeAssistant.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.homeAssistant.ingress.className }}
  ingressClassName: {{ .Values.homeAssistant.ingress.className }}
  {{- end }}
  tls:
    - hosts:
        {{- range .Values.homeAssistant.ingress.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ include "home-assistant.fullname" . }}-tls
  rules:
    {{- range .Values.homeAssistant.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.homeAssistant.ingress.path }}
            pathType: {{ $.Values.homeAssistant.ingress.pathType }}
            backend:
              service:
                name: {{ include "home-assistant.fullname" $ }}
                port:
                  name: {{ $.Values.homeAssistant.ingress.servicePort }}
    {{- end }}
{{- end }}
